[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equitable-rwe"
version = "0.1.0"
description = "Doubly-robust causal outcome estimation with integrated subgroup fairness auditing for real-world clinical evidence."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Nosakhare Osaro", email = "osaronosakhare@gmail.com" }]
keywords = [
    "causal-inference",
    "survival-analysis",
    "health-equity",
    "fairness",
    "real-world-evidence",
    "omop-cdm",
    "epidemiology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "lifelines>=0.30.3",
    "matplotlib>=3.11.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=25.0.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/NosakhareOsaro/privacygenomic"
Repository = "https://github.com/NosakhareOsaro/privacygenomic"
Issues = "https://github.com/NosakhareOsaro/privacygenomic/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/equitable_rwe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "src", "data"]
addopts = "--doctest-modules --cov=equitable_rwe --cov-report=term-missing"

[tool.coverage.run]
source = ["src/equitable_rwe"]
