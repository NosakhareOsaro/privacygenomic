repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Deliberately no additional_dependencies (e.g. pandas-stubs):
        # CI runs `mypy src` against this project's own dependencies only
        # (see pyproject.toml's [tool.mypy]), and this hook is kept
        # consistent with that rather than enforcing a stricter local
        # check that CI doesn't also enforce.
        args: [--ignore-missing-imports]
        exclude: ^(tests/|notebooks/|benchmark/|data/|dashboards/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
